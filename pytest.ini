[pytest]
asyncio_mode = auto
testpaths = tests
# `src/` is the import root for the bot (`utils`, `services`, `cogs`, `shared`).
# Putting it on sys.path here keeps tests importable without an editable
# install, and makes `import bot` resolve to `src/bot.py` instead of the legacy
# `bot/` package in the repository root.
pythonpath = src
python_files = test_*.py
python_classes = Test*
python_functions = test_*
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests that need a database (deselect with '-m "not integration"')
    security: marks security-related tests
    asyncio: mark test as async
